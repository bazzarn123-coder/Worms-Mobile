<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Worms Armageddon Mobile Style</title>
    <!-- Browser address bar icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪱</text></svg>">
    <!-- PeerJS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #4db8ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
        }
        canvas {
            display: block;
            background: #4db8ff;
        }
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), url('worms.jpg') no-repeat center center / cover;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #splash-screen h1 {
            font-size: 2.5rem;
            color: #ffeb3b;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            margin-bottom: 5px;
        }
        #splash-screen h2 {
            font-size: 1.2rem;
            color: #4db8ff;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 400;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .mode-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 25px;
        }
        .mode-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .mode-btn.active {
            background: #ff9800;
            border-color: #ffeb3b;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.6);
        }
        #online-panel {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 360px;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed rgba(255,255,255,0.4);
            margin-bottom: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(4px);
        }
        #online-panel input {
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            text-align: center;
        }
        .action-main-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            text-transform: uppercase;
        }
        #ui-top {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        #turn-info { font-size: 18px; font-weight: bold; }
        
        .ui-btns {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .top-btn {
            background: rgba(50, 150, 220, 0.9);
            color: white;
            border: 2px solid white;
            border-radius: 6px;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            pointer-events: auto;
        }
        .row { display: flex; gap: 5px; }
        button {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 18px;
            min-width: 55px;
            min-height: 55px;
            text-shadow: 1px 1px 2px black;
        }
        button:active { background: rgba(255, 255, 255, 0.5); color: black; }
        
        #btn-fire { background: rgba(255, 50, 50, 0.8); }
        #current-weapon-display { font-size: 12px; color: #ffeb3b; font-weight: bold; text-shadow: 1px 1px 2px black; }

        /* Modals Box Style */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 30, 0.95);
            border: 3px solid rgba(255, 255, 255, 0.8);
            color: white;
            padding: 20px;
            border-radius: 14px;
            z-index: 100;
            width: 85%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }
        .modal h2 { margin-top: 0; text-align: center; color: #ffeb3b; }
        
        .weapon-card, .worm-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .weapon-card.selected, .worm-card.selected {
            border-color: #ffeb3b;
            background: rgba(255, 235, 59, 0.15);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-name { font-weight: bold; font-size: 16px; }
        .action-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            min-height: auto;
            min-width: auto;
        }
        .timer-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            margin-top: 4px;
        }
        .timer-btn {
            background: #444;
            color: white;
            border: 1px solid #777;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            min-width: auto;
            min-height: auto;
        }
        .timer-btn.active { background: #ff9800; border-color: #fff; }
        .close-modal-btn {
            width: 100%;
            margin-top: 10px;
            background: #f44336;
            border: none;
            border-radius: 6px;
            padding: 10px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            min-height: auto;
        }
    </style>
</head>
<body>

    <!-- Splash Screen with Game Mode Choices -->
    <div id="splash-screen">
        <h1></h1>
        <h2></h2>
        
        <p style="font-size: 0.95rem; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); margin-bottom: 15px; font-weight: bold;">Select Game Mode:</p>
        
        <div class="mode-container">
            <button class="mode-btn active" id="btn-mode-sp" onclick="setGameMode('sp')">🪱 Single Player (Yellow vs AI)</button>
            <button class="mode-btn" id="btn-mode-local" onclick="setGameMode('local')">👥 Local 2-Player (Pass & Play)</button>
            <button class="mode-btn" id="btn-mode-online" onclick="setGameMode('online')">🌐 Online Multiplayer (PeerJS)</button>
        </div>

        <!-- Online Panel -->
        <div id="online-panel">
            <div id="connection-status" style="font-size: 0.9rem; color: #ffeb3b;">Initializing Peer...</div>
            <div style="display: flex; gap: 8px;">
                <button class="action-btn" style="flex:1;" onclick="hostOnlineGame()">Host Room</button>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 5px;">
                <input type="text" id="peer-id-input" placeholder="Enter Host ID">
                <button class="action-btn" onclick="joinOnlineGame()">Join</button>
            </div>
        </div>

        <button class="action-main-btn" onclick="startGame()">Tap to Start Game</button>
    </div>

    <div id="ui-top">
        <div>
            <div id="turn-info">Team Yellow's Turn</div>
            <div id="current-weapon-display">Weapon: Bazooka</div>
        </div>
        <div class="ui-btns">
            <button class="top-btn" onclick="openChooseWormModal()">Choose Worm 🪱</button>
            <button class="top-btn" onclick="openWeaponLocker()">Arsenal 🎒</button>
        </div>
    </div>

    <!-- Weapons Locker Modal Box -->
    <div id="weapon-modal" class="modal">
        <h2>Weapons Locker</h2>
        <div id="weapon-list-container"></div>
        <button class="close-modal-btn" onclick="closeModal('weapon-modal')">Confirm & Close</button>
    </div>

    <!-- Choose Worm Modal Box -->
    <div id="worm-modal" class="modal">
        <h2>Choose Team Worm</h2>
        <div id="worm-list-container"></div>
        <button class="close-modal-btn" onclick="closeModal('worm-modal')">Cancel & Close</button>
    </div>

    <!-- On-screen controls -->
    <div id="controls">
        <div class="btn-group">
            <button id="btn-up" class="touch-btn">Aim ↑</button>
            <div class="row">
                <button id="btn-left" class="touch-btn">← Walk</button>
                <button id="btn-right" class="touch-btn">Walk →</button>
            </div>
            <button id="btn-down" class="touch-btn">Aim ↓</button>
        </div>
        
        <div class="btn-group">
            <button id="btn-fire" class="touch-btn">FIRE / ACT</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Game Started State Flag ---
        let gameStarted = false;

        // --- Game Mode & PeerJS State ---
        let gameMode = 'sp'; // 'sp', 'local', 'online'
        let peer = null;
        let conn = null;
        let isHost = true;
        let myTeamRole = 'Yellow'; // In online mode, host = Yellow, client = Blue

        function setGameMode(mode) {
            SoundFX.click();
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if (mode === 'sp') document.getElementById('btn-mode-sp').classList.add('active');
            if (mode === 'local') document.getElementById('btn-mode-local').classList.add('active');
            if (mode === 'online') document.getElementById('btn-mode-online').classList.add('active');

            let onlinePanel = document.getElementById('online-panel');
            if (mode === 'online') {
                onlinePanel.style.display = 'flex';
                initPeer();
            } else {
                onlinePanel.style.display = 'none';
            }
        }

        function initPeer() {
            if (typeof Peer === 'undefined') {
                document.getElementById('connection-status').innerText = "PeerJS failed to load (Check internet/CDN)";
                return;
            }
            if (peer) return;
            try {
                peer = new Peer();
                peer.on('open', (id) => {
                    document.getElementById('connection-status').innerText = "My ID: " + id + " (Share to play)";
                });
                peer.on('connection', (connection) => {
                    conn = connection;
                    isHost = true;
                    myTeamRole = 'Yellow';
                    setupPeerConnection();
                    document.getElementById('connection-status').innerText = "Player Connected! Ready to start.";
                });
                peer.on('error', (err) => {
                    document.getElementById('connection-status').innerText = "Peer Error: " + err.type;
                });
            } catch (e) {
                document.getElementById('connection-status').innerText = "Peer initialization error.";
            }
        }

        function hostOnlineGame() {
            SoundFX.click();
            if(!peer) initPeer();
            document.getElementById('connection-status').innerText = "Waiting for connection on ID: " + (peer && peer.id ? peer.id : 'initializing...');
        }

        function joinOnlineGame() {
            SoundFX.click();
            let remoteId = document.getElementById('peer-id-input').value.trim();
            if (!remoteId) { alert("Please enter a valid Host Peer ID"); return; }
            if (!peer) { alert("Peer not initialized yet"); return; }
            
            conn = peer.connect(remoteId);
            isHost = false;
            myTeamRole = 'Blue';
            setupPeerConnection();
            document.getElementById('connection-status').innerText = "Connecting to Host...";
        }

        function setupPeerConnection() {
            conn.on('open', () => {
                document.getElementById('connection-status').innerText = "Connected Online!";
                if (isHost) {
                    sendNetworkData({ type: 'INIT', terrain: terrain, worms: worms });
                }
            });
            conn.on('data', (data) => {
                handleNetworkData(data);
            });
        }

        function sendNetworkData(data) {
            if (conn && conn.open) {
                conn.send(data);
            }
        }

        function handleNetworkData(data) {
            if (data.type === 'INIT') {
                terrain = data.terrain;
                worms = data.worms;
                centerCameraOnWorm(worms[currentTurn]);
            } else if (data.type === 'ACTION') {
                if (data.action === 'FIRE') {
                    angle = data.angle;
                    power = data.power;
                    currentWeaponIdx = data.weaponIdx;
                    fireWeapon(true);
                } else if (data.action === 'MOVE') {
                    let w = worms[data.turnIdx];
                    if (w) {
                        w.x = data.x;
                        w.y = data.y;
                        w.facing = data.facing;
                    }
                } else if (data.action === 'NEXT_TURN') {
                    currentTurn = data.currentTurn;
                    let cw = worms[currentTurn];
                    const turnInfo = document.getElementById('turn-info');
                    turnInfo.innerText = `Team ${cw.team}'s Turn`;
                    turnInfo.style.color = cw.color;
                    centerCameraOnWorm(cw);
                }
            }
        }

        // --- Web Audio API Sound Engine (Safely Wrapped) ---
        let audioCtx = null;

        function initAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {
                console.warn("AudioContext not supported or restricted", e);
            }
        }

        const SoundFX = {
            click() {
                initAudio();
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            },
            shoot() {
                initAudio();
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            },
            explosion() {
                initAudio();
                if (!audioCtx) return;
                let bufferSize = audioCtx.sampleRate * 0.8;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8);

                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
                noise.stop(audioCtx.currentTime + 0.8);
            },
            machineGun() {
                initAudio();
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let screenWidth = window.innerWidth;
        let screenHeight = window.innerHeight;
        canvas.width = screenWidth;
        canvas.height = screenHeight;

        const worldWidth = 3200;
        const worldHeight = 2200;

        let zoom = 0.85;
        const minZoom = 0.35;
        const maxZoom = 2.0;
        let cameraX = 0;
        let cameraY = 0;

        function clampCamera() {
            let maxCamX = Math.max(0, worldWidth - (screenWidth / zoom));
            let maxCamY = Math.max(0, worldHeight - (screenHeight / zoom));
            cameraX = Math.max(0, Math.min(maxCamX, cameraX));
            cameraY = Math.max(0, Math.min(maxCamY, cameraY));
        }

        function centerCameraOnWorm(w) {
            if (!w) return;
            cameraX = w.x - (screenWidth / zoom) / 2;
            cameraY = w.y - (screenHeight / zoom) / 2;
            clampCamera();
        }

        const weapons = [
            { name: "Bazooka", type: "projectile", bounce: 0, timer: 0, radius: 45, adjustableTimer: false },
            { name: "Banana Bomb", type: "projectile", bounce: 0.3, timer: 120, radius: 75, adjustableTimer: true },
            { name: "Grenade", type: "projectile", bounce: 0.4, timer: 120, radius: 50, adjustableTimer: true },
            { name: "Machine Gun", type: "machinegun", adjustableTimer: false },
            { name: "Kamikaze", type: "kamikaze", adjustableTimer: false }
        ];
        let currentWeaponIdx = 0;

        function buildWeaponLockerUI() {
            SoundFX.click();
            const container = document.getElementById('weapon-list-container');
            container.innerHTML = '';
            weapons.forEach((w, idx) => {
                let card = document.createElement('div');
                card.className = `weapon-card ${idx === currentWeaponIdx ? 'selected' : ''}`;
                
                let header = document.createElement('div');
                header.className = 'card-header';
                header.innerHTML = `
                    <span class="card-name">${w.name}</span>
                    <button class="action-btn" onclick="selectWeapon(${idx})">${idx === currentWeaponIdx ? 'Equipped' : 'Equip'}</button>
                `;
                card.appendChild(header);

                if (w.adjustableTimer) {
                    let timerRow = document.createElement('div');
                    timerRow.className = 'timer-row';
                    timerRow.innerHTML = `<span>Timer Fuse:</span>`;
                    
                    [1, 2, 3, 4, 5].forEach(sec => {
                        let tBtn = document.createElement('button');
                        tBtn.className = `timer-btn ${w.timer === sec * 60 ? 'active' : ''}`;
                        tBtn.innerText = `${sec}s`;
                        tBtn.onclick = (e) => {
                            e.stopPropagation();
                            SoundFX.click();
                            w.timer = sec * 60;
                            buildWeaponLockerUI();
                        };
                        timerRow.appendChild(tBtn);
                    });
                    card.appendChild(timerRow);
                }
                container.appendChild(card);
            });
        }

        function buildChooseWormUI() {
            SoundFX.click();
            const container = document.getElementById('worm-list-container');
            container.innerHTML = '';
            
            if (worms.length === 0) return;
            let currentTeam = worms[currentTurn].team;
            
            worms.forEach((w, idx) => {
                if (w.team === currentTeam) {
                    let card = document.createElement('div');
                    card.className = `worm-card ${idx === currentTurn ? 'selected' : ''}`;
                    
                    let header = document.createElement('div');
                    header.className = 'card-header';
                    header.innerHTML = `
                        <span class="card-name" style="color: ${w.color}">Worm ${w.id} (HP: ${w.hp})</span>
                        <button class="action-btn" onclick="selectActiveWorm(${idx})">${idx === currentTurn ? 'Selected' : 'Control'}</button>
                    `;
                    card.appendChild(header);
                    container.appendChild(card);
                }
            });
        }

        function openWeaponLocker() {
            buildWeaponLockerUI();
            document.getElementById('weapon-modal').style.display = 'block';
        }

        function openChooseWormModal() {
            buildChooseWormUI();
            document.getElementById('worm-modal').style.display = 'block';
        }

        function closeModal(modalId) {
            SoundFX.click();
            document.getElementById(modalId).style.display = 'none';
        }

        function selectWeapon(idx) {
            SoundFX.click();
            currentWeaponIdx = idx;
            document.getElementById('current-weapon-display').innerText = "Weapon: " + weapons[currentWeaponIdx].name;
            buildWeaponLockerUI();
        }

        function selectActiveWorm(idx) {
            SoundFX.click();
            currentTurn = idx;
            let cw = worms[currentTurn];
            const turnInfo = document.getElementById('turn-info');
            turnInfo.innerText = `Team ${cw.team}'s Turn`;
            turnInfo.style.color = cw.color;
            centerCameraOnWorm(cw);
            closeModal('worm-modal');
        }

        let terrain = [];
        let o1 = Math.random() * 100;
        let o2 = Math.random() * 100;
        for (let i = 0; i < worldWidth; i++) {
            let baseH = worldHeight * 0.75; 
            let heightVal = baseH + 
                Math.sin(i / 150 + o1) * 160 + 
                Math.cos(i / 50 + o2) * 80;
            if (heightVal < worldHeight * 0.6) heightVal = worldHeight * 0.6;
            terrain.push(heightVal);
        }

        let clouds = [];
        for(let i = 0; i < 18; i++) {
            clouds.push({
                x: Math.random() * worldWidth,
                y: Math.random() * (worldHeight * 0.5),
                width: 120 + Math.random() * 180,
                height: 40 + Math.random() * 40,
                speed: 0.1 + Math.random() * 0.3
            });
        }

        let scenery = [];
        for(let i = 0; i < 18; i++) {
            let sx = 150 + Math.random() * (worldWidth - 300);
            let type = Math.random() > 0.4 ? 'tree' : 'bunker';
            scenery.push({ x: sx, y: 0, type: type, active: true });
        }

        let worms = [];
        for(let i = 0; i < 4; i++) {
            worms.push({ id: `Y_${i}`, x: 200 + i * 220 + Math.random() * 60, hp: 100, color: '#ffeb3b', team: 'Yellow', facing: 1, kamikazeActive: false });
            worms.push({ id: `B_${i}`, x: worldWidth - 1100 + i * 220 + Math.random() * 60, hp: 100, color: '#2196f3', team: 'Blue', facing: -1, kamikazeActive: false });
        }
        
        worms.forEach(w => w.y = terrain[Math.floor(w.x)]);
        scenery.forEach(s => s.y = terrain[Math.floor(s.x)]);

        let currentTurn = 0;
        let angle = -Math.PI / 4;
        let power = 0;
        let charging = false;
        let projectile = null;
        let activeBullets = [];
        let particles = [];
        let aiThinking = false;
        let turnTransitioning = false;
        
        let input = { left: false, right: false, up: false, down: false, fire: false };

        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let startPanX = 0;
        let startPanY = 0;

        let initialPinchDist = null;
        let initialZoom = 1.0;

        // --- Double Tap Zoom Handling ---
        let lastTapTime = 0;
        const doubleTapThreshold = 300;

        function handleDoubleTap() {
            if (worms.length === 0) return;
            let cw = worms[currentTurn];
            if (!cw) return;

            if (zoom < 1.2) {
                zoom = 1.6;
                centerCameraOnWorm(cw);
            } else {
                zoom = 0.45;
                cameraX = (worldWidth / 2) - (screenWidth / zoom) / 2;
                cameraY = (worldHeight / 2) - (screenHeight / zoom) / 2;
                clampCamera();
            }
        }

        window.addEventListener('touchend', (e) => {
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTapTime;
            if (tapLength < doubleTapThreshold && tapLength > 0) {
                handleDoubleTap();
                e.preventDefault();
            }
            lastTapTime = currentTime;

            if (e.touches.length < 2) {
                initialPinchDist = null;
            }
            if (e.touches.length === 0) {
                isDragging = false;
            }
        });

        window.addEventListener('dblclick', (e) => {
            if(e.target.tagName === 'BUTTON' || document.querySelector('.modal[style*="block"]') || document.getElementById('splash-screen').style.display !== 'none') return;
            handleDoubleTap();
        });

        window.addEventListener('touchstart', (e) => {
            initAudio();
            if(e.target.tagName === 'BUTTON' || document.querySelector('.modal[style*="block"]') || document.getElementById('splash-screen').style.display !== 'none') return;
            
            if (e.touches.length === 2) {
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialZoom = zoom;
                isDragging = false;
            } else if (e.touches.length === 1) {
                isDragging = true;
                dragStartX = e.touches[0].clientX;
                dragStartY = e.touches[0].clientY;
                startPanX = cameraX;
                startPanY = cameraY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDist !== null) {
                let currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                let factor = currentDist / initialPinchDist;
                zoom = Math.max(minZoom, Math.min(maxZoom, initialZoom * factor));
                clampCamera();
            } else if (isDragging && e.touches.length === 1) {
                let dx = (e.touches[0].clientX - dragStartX) / zoom;
                let dy = (e.touches[0].clientY - dragStartY) / zoom;
                cameraX = startPanX - dx;
                cameraY = startPanY - dy;
                clampCamera();
            }
        });

        window.addEventListener('mousedown', (e) => {
            initAudio();
            if(e.target.tagName === 'BUTTON' || document.querySelector('.modal[style*="block"]') || document.getElementById('splash-screen').style.display !== 'none') return;
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            startPanX = cameraX;
            startPanY = cameraY;
        });

        window.addEventListener('mousemove', (e) => {
            if(!isDragging) return;
            let dx = (e.clientX - dragStartX) / zoom;
            let dy = (e.clientY - dragStartY) / zoom;
            cameraX = startPanX - dx;
            cameraY = startPanY - dy;
            clampCamera();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('wheel', (e) => {
            if(document.getElementById('splash-screen').style.display !== 'none') return;
            e.preventDefault();
            let zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            let oldZoom = zoom;
            zoom = Math.max(minZoom, Math.min(maxZoom, zoom * zoomFactor));
            
            let mouseX = e.clientX;
            let mouseY = e.clientY;
            cameraX = (mouseX / oldZoom + cameraX) - (mouseX / zoom);
            cameraY = (mouseY / oldZoom + cameraY) - (mouseY / zoom);
            clampCamera();
        }, { passive: false });

        function startGame() {
            initAudio();
            gameStarted = true;
            document.getElementById('splash-screen').style.display = 'none';
            if(worms.length > 0) {
                centerCameraOnWorm(worms[currentTurn]);
            }
        }

        function bindBtn(id, key) {
            let btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); input[key] = true; });
            btn.addEventListener('touchend', (e) => { 
                e.preventDefault(); 
                input[key] = false; 
                if(key === 'fire' && charging && !projectile && !turnTransitioning) fireWeapon();
            });
            btn.addEventListener('mousedown', () => { initAudio(); input[key] = true; });
            btn.addEventListener('mouseup', () => { 
                input[key] = false; 
                if(key === 'fire' && charging && !projectile && !turnTransitioning) fireWeapon();
            });
        }

        bindBtn('btn-up', 'up');
        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');
        bindBtn('btn-down', 'down');
        bindBtn('btn-fire', 'fire');

        function fireWeapon(remoteCall = false) {
            if (worms.length === 0 || turnTransitioning) return;
            let w = worms[currentTurn];
            let wep = weapons[currentWeaponIdx];

            if (!remoteCall && gameMode === 'online') {
                sendNetworkData({
                    type: 'ACTION',
                    action: 'FIRE',
                    angle: angle,
                    power: power,
                    weaponIdx: currentWeaponIdx
                });
            }

            if (wep.type === 'projectile') {
                SoundFX.shoot();
                projectile = {
                    x: w.x,
                    y: w.y - 15,
                    vx: Math.cos(angle) * power * 0.35, 
                    vy: Math.sin(angle) * power * 0.35,
                    rotation: 0,
                    type: wep,
                    life: wep.timer
                };
            } else if (wep.type === 'machinegun') {
                turnTransitioning = true;
                let burstCount = 0;
                let interval = setInterval(() => {
                    if(burstCount >= 6) {
                        clearInterval(interval);
                        setTimeout(nextTurn, 1000);
                        return;
                    }
                    SoundFX.machineGun();
                    activeBullets.push({
                        x: w.x,
                        y: w.y - 15,
                        vx: Math.cos(angle) * 18 + (Math.random() - 0.5) * 2,
                        vy: Math.sin(angle) * 18 + (Math.random() - 0.5) * 2
                    });
                    burstCount++;
                }, 120);
            } else if (wep.type === 'kamikaze') {
                SoundFX.shoot();
                w.kamikazeActive = true;
            }
            charging = false;
            power = 0;
        }

        function createExplosionParticles(x, y) {
            for(let i = 0; i < 45; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.5) * 14,
                    life: 1.0,
                    color: Math.random() > 0.4 ? '#ffaa00' : (Math.random() > 0.5 ? '#ff2200' : '#333')
                });
            }
        }

        function checkWinCondition() {
            let yellowAlive = worms.some(w => w.team === 'Yellow' && w.hp > 0);
            let blueAlive = worms.some(w => w.team === 'Blue' && w.hp > 0);
            const turnInfo = document.getElementById('turn-info');

            if (!yellowAlive || !blueAlive || worms.length === 0) {
                if (!blueAlive && yellowAlive) {
                    turnInfo.innerText = "Team Yellow Wins!";
                    turnInfo.style.color = '#ffeb3b';
                } else if (!yellowAlive && blueAlive) {
                    turnInfo.innerText = "Team Blue Wins!";
                    turnInfo.style.color = '#2196f3';
                } else {
                    turnInfo.innerText = "Draw!";
                    turnInfo.style.color = 'white';
                }
                return true;
            }
            return false;
        }

        function explode(ex, ey, radius) {
            SoundFX.explosion();
            createExplosionParticles(ex, ey);

            for (let i = -radius; i <= radius; i++) {
                let tx = Math.floor(ex + i);
                if (tx >= 0 && tx < worldWidth) {
                    let dist = Math.abs(i);
                    let depth = Math.sqrt(radius * radius - dist * dist);
                    if (terrain[tx] < ey + depth) terrain[tx] = ey + depth;
                }
            }
            
            worms.forEach(w => {
                let dx = w.x - ex; let dy = w.y - ey;
                let dist = Math.hypot(dx, dy);
                if (dist < radius * 1.5) {
                    w.hp -= Math.floor(55 * (1 - dist / (radius * 1.5)));
                }
            });

            scenery.forEach(s => {
                if(s.active && Math.hypot(s.x - ex, s.y - ey) < radius * 1.2) {
                    s.active = false;
                }
            });

            worms = worms.filter(w => w.hp > 0 && w.y < worldHeight + 100);
            checkWinCondition();
        }

        function nextTurn() {
            projectile = null;
            activeBullets = [];
            turnTransitioning = false;
            worms = worms.filter(w => w.hp > 0 && w.y < worldHeight + 100);
            
            if (checkWinCondition()) return;
            
            // Strictly alternate teams: find the next living worm of the opposite team
            let currentWorm = worms[currentTurn];
            let currentTeam = currentWorm ? currentWorm.team : 'Yellow';
            let nextTeam = currentTeam === 'Yellow' ? 'Blue' : 'Yellow';

            let candidateIndices = worms.map((w, idx) => ({w, idx})).filter(item => item.w.team === nextTeam);
            if (candidateIndices.length === 0) {
                checkWinCondition();
                return;
            }

            let nextItem = candidateIndices.find(item => item.idx > currentTurn);
            if (!nextItem) {
                nextItem = candidateIndices[0];
            }
            
            currentTurn = nextItem.idx;
            let cw = worms[currentTurn];
            const turnInfo = document.getElementById('turn-info');
            turnInfo.innerText = `Team ${cw.team}'s Turn`;
            turnInfo.style.color = cw.color;
            
            centerCameraOnWorm(cw);

            if (gameMode === 'online' && isHost) {
                sendNetworkData({ type: 'ACTION', action: 'NEXT_TURN', currentTurn: currentTurn });
            }
        }

        function runAITurn() {
            if (aiThinking || turnTransitioning) return;
            aiThinking = true;
            
            let cw = worms[currentTurn];
            if (!cw || cw.team !== 'Blue') {
                aiThinking = false;
                return;
            }

            setTimeout(() => {
                let enemies = worms.filter(w => w.team === 'Yellow' && w.hp > 0);
                if (enemies.length === 0) { aiThinking = false; return; }
                
                let target = enemies[0];
                let minDist = Math.abs(target.x - cw.x);
                enemies.forEach(e => {
                    let d = Math.abs(e.x - cw.x);
                    if (d < minDist) {
                        minDist = d;
                        target = e;
                    }
                });
                
                cw.facing = target.x > cw.x ? 1 : -1;
                
                let walkSteps = 0;
                let walkInterval = setInterval(() => {
                    if (walkSteps < 15 && Math.abs(target.x - cw.x) > 180) {
                        cw.x += cw.facing * 1.5;
                        cw.x = Math.max(10, Math.min(worldWidth - 10, cw.x));
                        cw.y = terrain[Math.floor(cw.x)];
                        walkSteps++;
                    } else {
                        clearInterval(walkInterval);
                        
                        let dx = target.x - cw.x;
                        let dy = target.y - cw.y;
                        angle = Math.atan2(dy, dx);
                        if (angle > 0.4) angle = 0.4;
                        if (angle < -Math.PI) angle = -Math.PI;
                        
                        setTimeout(() => {
                            power = 22 + Math.random() * 22;
                            fireWeapon();
                            aiThinking = false;
                        }, 800);
                    }
                }, 50);
                
            }, 1000);
        }

        function update() {
            clouds.forEach(c => {
                c.x += c.speed;
                if (c.x > worldWidth + c.width) c.x = -c.width;
            });

            if(worms.length === 0) return;
            currentTurn = currentTurn % worms.length;
            let cw = worms[currentTurn];

            if (gameMode === 'sp' && cw && cw.team === 'Blue' && !projectile && activeBullets.length === 0 && !turnTransitioning) {
                runAITurn();
            }

            if (cw && cw.kamikazeActive) {
                turnTransitioning = true;
                cw.x += cw.facing * 4;
                cw.x = Math.max(10, Math.min(worldWidth - 10, cw.x));
                cw.y = terrain[Math.floor(cw.x)];

                // Follow kamikaze worm with camera
                cameraX = cw.x - (screenWidth / zoom) / 2;
                cameraY = cw.y - (screenHeight / zoom) / 2;
                clampCamera();

                let hitEnemy = worms.some(w => w !== cw && Math.abs(w.x - cw.x) < 20);
                if (hitEnemy || Math.random() < 0.02) {
                    cw.hp = 0;
                    explode(cw.x, cw.y - 10, 70);
                    cw.kamikazeActive = false;
                    setTimeout(() => {
                        nextTurn();
                    }, 1000);
                }
                return;
            }

            let canControl = true;
            if (gameMode === 'sp' && cw && cw.team === 'Blue') canControl = false;
            
            if (!projectile && activeBullets.length === 0 && worms.length > 1 && !cw.kamikazeActive && canControl && !turnTransitioning) {
                if (input.left) { cw.x -= 1.5; cw.facing = -1; }
                if (input.right) { cw.x += 1.5; cw.facing = 1; }
                cw.x = Math.max(10, Math.min(worldWidth - 10, cw.x));
                
                let targetY = terrain[Math.floor(cw.x)];
                if (targetY - cw.y < 15) cw.y = targetY;

                if (input.up) angle -= 0.04;
                if (input.down) angle += 0.04;

                if (input.fire) {
                    charging = true;
                    power += 0.8;
                    if (power > 50) power = 50;
                }
            } 
            
            if (projectile) {
                turnTransitioning = true;
                projectile.vy += 0.15;
                projectile.x += projectile.vx;
                projectile.y += projectile.vy;
                projectile.rotation += 0.2;

                // Lock and track camera on flying projectile
                cameraX = projectile.x - (screenWidth / zoom) / 2;
                cameraY = projectile.y - (screenHeight / zoom) / 2;
                clampCamera();

                let exploded = false;

                if (projectile.x < 0 || projectile.x > worldWidth || projectile.y > worldHeight + 100) {
                    projectile = null;
                    setTimeout(() => {
                        nextTurn();
                    }, 1000);
                    return;
                } 

                if (projectile.type.timer > 0) {
                    projectile.life--;
                    if (projectile.life <= 0) {
                        exploded = true;
                    }
                }

                let tx = Math.floor(projectile.x);
                if (tx >= 0 && tx < worldWidth && projectile.y >= terrain[tx]) {
                    if (projectile.type.bounce > 0 && projectile.type.timer > 0) {
                        projectile.y = terrain[tx] - 1;
                        projectile.vy = -projectile.vy * projectile.type.bounce;
                        projectile.vx = projectile.vx * 0.75;
                    } else {
                        exploded = true;
                    }
                }

                if (!exploded) {
                    for (let i = 0; i < worms.length; i++) {
                        let w = worms[i];
                        if (Math.hypot(projectile.x - w.x, projectile.y - (w.y - 10)) < 15) {
                            exploded = true; break;
                        }
                    }
                }

                if (exploded) {
                    let ex = projectile.x;
                    let ey = projectile.y;
                    let rad = projectile.type.radius;
                    projectile = null; // Clear so it stops updating immediately
                    explode(ex, ey, rad);
                    setTimeout(() => {
                        nextTurn();
                    }, 1000);
                }
            }

            if (activeBullets.length > 0) {
                activeBullets.forEach(b => {
                    b.vy += 0.1;
                    b.x += b.vx;
                    b.y += b.vy;
                });
                
                let remainingBullets = [];
                activeBullets.forEach(b => {
                    let tx = Math.floor(b.x);
                    let hit = false;
                    if (b.x < 0 || b.x > worldWidth || b.y > worldHeight) hit = true;
                    else if (tx >= 0 && tx < worldWidth && b.y >= terrain[tx]) {
                        hit = true;
                        explode(b.x, b.y, 15);
                    } else {
                        worms.forEach(w => {
                            if (Math.hypot(b.x - w.x, b.y - (w.y - 10)) < 10) {
                                hit = true;
                                w.hp -= 10;
                                createExplosionParticles(b.x, b.y);
                            }
                        });
                    }
                    if (!hit) remainingBullets.push(b);
                });
                activeBullets = remainingBullets;
            }

            worms.forEach(w => {
                let groundY = terrain[Math.floor(w.x)];
                if (w.y < groundY) w.y += 3;
                if (w.y > groundY) w.y = groundY;
            });
            scenery.forEach(s => {
                if(s.active) {
                    let groundY = terrain[Math.floor(s.x)];
                    if (s.y < groundY) s.y += 3;
                    if (s.y > groundY) s.y = groundY;
                }
            });

            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.1; p.life -= 0.03;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function draw() {
            ctx.clearRect(0, 0, screenWidth, screenHeight);

            ctx.fillStyle = '#4db8ff';
            ctx.fillRect(0, 0, worldWidth, worldHeight);

            ctx.save();
            ctx.scale(zoom, zoom);
            ctx.translate(-cameraX, -cameraY);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.height, 0, Math.PI * 2);
                ctx.arc(c.x + c.width * 0.35, c.y - c.height * 0.3, c.height * 0.8, 0, Math.PI * 2);
                ctx.arc(c.x + c.width * 0.7, c.y, c.height * 0.9, 0, Math.PI * 2);
                ctx.fill();
            });

            scenery.forEach(s => {
                if(s.active && s.type === 'tree') {
                    ctx.fillStyle = '#654321';
                    ctx.fillRect(s.x - 5, s.y - 35, 10, 35);
                    ctx.fillStyle = '#228b22';
                    ctx.beginPath(); ctx.arc(s.x, s.y - 40, 22, 0, Math.PI * 2); ctx.fill();
                }
            });

            ctx.fillStyle = '#5c4033';
            ctx.beginPath(); ctx.moveTo(0, worldHeight);
            for (let i = 0; i < worldWidth; i++) ctx.lineTo(i, terrain[i]);
            ctx.lineTo(worldWidth, worldHeight); ctx.fill();
            
            ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 6;
            ctx.beginPath();
            for (let i = 0; i < worldWidth; i++) {
                if (i === 0) ctx.moveTo(i, terrain[i]);
                else ctx.lineTo(i, terrain[i]);
            }
            ctx.stroke();

            worms.forEach((w) => {
                ctx.fillStyle = w.color;
                ctx.fillRect(w.x - 6, w.y - 16, 12, 16);
                
                if (w.kamikazeActive) {
                    ctx.fillStyle = 'white';
                    ctx.fillRect(w.x - 7, w.y - 15, 14, 4);
                    ctx.fillStyle = 'red';
                    ctx.fillRect(w.x - 2, w.y - 14, 4, 2);
                }

                ctx.fillStyle = 'white';
                let eyeX = w.facing === 1 ? w.x + 1 : w.x - 5;
                ctx.fillRect(eyeX, w.y - 12, 4, 4);
                ctx.fillStyle = 'black';
                let pupilX = w.facing === 1 ? w.x + 3 : w.x - 5;
                ctx.fillRect(pupilX, w.y - 11, 2, 2);

                ctx.fillStyle = 'black'; ctx.fillRect(w.x - 11, w.y - 26, 22, 5);
                ctx.fillStyle = 'red'; ctx.fillRect(w.x - 10, w.y - 25, 20, 3);
                ctx.fillStyle = '#00ff00'; 
                ctx.fillRect(w.x - 10, w.y - 25, 20 * (Math.max(0, w.hp) / 100), 3);
            });

            scenery.forEach(s => {
                if(s.active && s.type === 'bunker') {
                    ctx.fillStyle = '#777';
                    ctx.beginPath(); ctx.arc(s.x, s.y, 28, Math.PI, 0); ctx.fill();
                    ctx.fillStyle = '#333';
                    ctx.beginPath(); ctx.arc(s.x, s.y, 12, Math.PI, 0); ctx.fill();
                }
            });

            if (!projectile && activeBullets.length === 0 && worms.length > 1 && currentTurn < worms.length && !worms[currentTurn].kamikazeActive && !turnTransitioning) {
                let cw = worms[currentTurn];
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(cw.x, cw.y - 10);
                let aimDist = 60;
                ctx.lineTo(cw.x + Math.cos(angle) * aimDist, cw.y - 10 + Math.sin(angle) * aimDist);
                ctx.stroke(); ctx.setLineDash([]);

                if (charging) {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(cw.x - 16, cw.y - 40, 32, 6);
                    ctx.fillStyle = 'yellow'; ctx.fillRect(cw.x - 15, cw.y - 39, (power / 50) * 30, 4);
                }
            }

            if (projectile) {
                ctx.save();
                ctx.translate(projectile.x, projectile.y);
                ctx.rotate(projectile.rotation);
                
                if (projectile.type.name === "Banana Bomb") {
                    ctx.fillStyle = '#ffe135';
                    ctx.beginPath(); ctx.arc(0, 0, 9, 0.2, Math.PI - 0.2); ctx.arc(0, 4, 6, Math.PI, 0, true); ctx.fill();
                } else if (projectile.type.name === "Grenade") {
                    ctx.fillStyle = '#228b22';
                    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillStyle = '#444';
                    ctx.beginPath(); ctx.ellipse(0, 0, 9, 4, 0, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }

            activeBullets.forEach(b => {
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
            });

            particles.forEach(p => {
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.restore();
        }

        // --- Main Game Loop ---
        function loop() {
            if (gameStarted) {
                update();
                draw();
            }
            requestAnimationFrame(loop);
        }

        loop();

        window.addEventListener('resize', () => {
            screenWidth = window.innerWidth;
            screenHeight = window.innerHeight;
            canvas.width = screenWidth;
            canvas.height = screenHeight;
        });
    </script>
</body>
</html>
